[package]
name = "bilberry"
version = "0.1.0"
edition = "2021"

[lib]
name = "bilberry_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# NOTE: do not enable `macos_kqueue`. The kqueue backend registers one open
# fd + one kevent per file, which exhausts per-process limits on large vaults,
# and its event-loop thread panics on a delete/rename race, which then makes
# `Drop` panic and crash the app. The default `macos_fsevent` backend uses the
# native FSEvents API and is safe for huge directory trees.
notify = "7"
pulldown-cmark = "0.11"
chrono = "0.4"
regex = "1"
encoding_rs = "0.8.35"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-os = "2.3.2"
urlencoding = "2.1.3"
